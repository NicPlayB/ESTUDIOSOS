{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración básica del documento -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificaciones</title>

    <!-- Enlaces a frameworks y fuentes externas -->
    <!-- Bootstrap para estilos y componentes responsive -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Fuente de Google para una tipografía moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="{% static 'css/administrador/certificaciones/listar_usuarios.css' %}">
</head>
<body>

    <!-- BOTÓN HAMBURGUESA -->
    <button class="hamburger-btn" id="hamburgerBtn" title="Menú">
        <i class="bi bi-list"></i>
    </button>

    <!-- OVERLAY PARA CERRAR NAV -->
    <div class="nav-overlay" id="navOverlay"></div>

    <div class="container-fluid p-0">
        <!-- LAYOUT PRINCIPAL -->
        <div class="main-layout">
            <!-- NAVEGACIÓN -->
            <div class="sidebar-nav">
                <div class="logo-section">
                    <!-- IMAGEN DEL LOGO -->
                    <img src="{% static 'img/Logo tipo Estudiosos_Mesa de trabajo 1 copia 14.png' %}" alt="Logo Estudiosos">
                    <span>Estudiosos</span>
                </div>
                <nav class="nav flex-column">
                    <a class="nav-link" href="{% url 'panel_administrador' %}">
                        <i class="bi bi-house-door"></i>Inicio
                    </a>

                    <a class="nav-link" href="{% url 'gestion_usuarios' %}">
                        <i class="bi bi-people-fill"></i>Gestión de Usuarios
                    </a>
                    
                    <a class="nav-link" href="{% url 'profesores' %}">
                        <i class="bi bi-person-badge"></i>Profesores
                    </a>
                    
                    <a class="nav-link active" href="{% url 'certificaciones' %}">
                        <i class="bi bi-award"></i>Certificaciones
                    </a>

                    <a class="nav-link" href="{% url 'documentos_usuario' %}" title="Documentos">
                        <i class="bi bi-file-text"></i>Tus Documentos
                    </a>

                    <a class="nav-link" href="{% url 'gestion_cursos' %}">
                        <i class="bi bi-book"></i>Gestión de Cursos
                    </a>

                    <a class="nav-link " href="{% url 'gestionar_novedades' %}">
                        <i class="bi bi-newspaper"></i>Gestión de Contenidos
                    </a>
                </nav>

                <!-- MENÚ USUARIO EN EL NAV -->
                <div class="sidebar-nav-footer">
                    <a class="nav-link" href="{% url 'perfil_usuario' %}">
                        <i class="bi bi-person"></i>Mi perfil
                    </a>
                    <a class="nav-link" href="{% url 'cerrar_sesion' %}">
                        <i class="bi bi-box-arrow-right"></i>Cerrar sesión
                    </a>
                </div>
            </div>

            <!-- CONTENIDO PRINCIPAL -->
            <div class="container-main">
                <!-- HEADER -->
                <div class="page-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <!-- Título principal de la página -->
                            <h2><i class="bi bi-award me-3"></i>Certificaciones</h2>
                        </div>
                    </div>
                </div>

                
                <!-- CONTENEDOR DE BÚSQUEDA CON BOTÓN -->
                <div class="search-container">
                    <h3><i class="bi bi-search"></i> Buscar Usuarios</h3>
                    <form id="form-busqueda" method="get" class="row g-3">
                        <div class="col-md-10">
                            <input
                                type="text"
                                id="busqueda"
                                name="q"
                                class="form-control"
                                placeholder="Buscar por nombre o documento"
                                value="{{ query }}"
                                autocomplete="off"
                            >
                        </div>
                        <div class="col-md-2 d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-search"></i> Buscar
                            </button>
                        </div>
                    </form>
                </div>

                <!-- TABLA DINÁMICA -->
                <div class="table-responsive-cards" id="tabla-usuarios">
                    {% include 'administrador/certificaciones/partials/tabla_usuarios.html' %}
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JS personalizado -->
    <script src="{% static 'js/administrador/certificaciones/listar_usuarios.js' %}"></script>

</body>
</html>
