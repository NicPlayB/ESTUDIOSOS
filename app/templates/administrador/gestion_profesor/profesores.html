{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesores</title>
    <link rel="icon" href="{% static 'img/Logo tipo Estudiosos_Mesa de trabajo 1 copia 1 (2) (1).png' %}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/administrador/gestion_profesor/profesores.css' %}">
</head>
<body>

    <button class="hamburger-btn" id="hamburgerBtn" title="Menú">
        <i class="bi bi-list"></i>
    </button>

    <div class="nav-overlay" id="navOverlay"></div>

    <div class="container-fluid p-0">
        <div class="main-layout">
            <div class="sidebar-nav">
                <div class="logo-section">
                    <img src="{% static 'img/Logo tipo Estudiosos_Mesa de trabajo 1 copia 14.png' %}" alt="Logo Estudiosos">
                    <span>Estudiosos</span>
                </div>
                <nav class="nav flex-column">
                    <a class="nav-link" href="{% url 'panel_administrador' %}">
                        <i class="bi bi-house-door"></i>Inicio
                    </a>
                    <a class="nav-link" href="{% url 'gestion_usuarios' %}">
                        <i class="bi bi-people-fill"></i>Gestión de Usuarios
                    </a>
                    <a class="nav-link active" href="{% url 'profesores' %}">
                        <i class="bi bi-person-badge"></i>Profesores
                    </a>
                    <a class="nav-link" href="{% url 'certificaciones' %}">
                        <i class="bi bi-award"></i>Certificaciones
                    </a>
                    <a class="nav-link" href="{% url 'documentos_usuario' %}" title="Documentos">
                        <i class="bi bi-file-text"></i>Tus Documentos
                    </a>
                    <a class="nav-link" href="{% url 'gestion_cursos' %}">
                        <i class="bi bi-book"></i>Gestión de Cursos
                    </a>
                    <a class="nav-link " href="{% url 'gestionar_novedades' %}">
                        <i class="bi bi-newspaper"></i>Gestión de Contenidos
                    </a>
                </nav>
                <div class="sidebar-nav-footer">
                    <a class="nav-link" href="{% url 'perfil_usuario' %}">
                        <i class="bi bi-person"></i>Mi perfil
                    </a>
                    <a class="nav-link" href="{% url 'cerrar_sesion' %}">
                        <i class="bi bi-box-arrow-right"></i>Cerrar sesión
                    </a>
                </div>
            </div>

            <div class="container-main">
                <div class="page-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h2><i class="bi bi-person-badge me-3"></i>Profesores</h2>
                        </div>
                    </div>
                </div>

                <div class="search-container">
                    <h3><i class="bi bi-search"></i> Buscar Profesores</h3>
                    <form id="searchForm" class="row g-3">
                        <div class="col-md-10">
                            <input
                                type="text"
                                id="buscador"
                                class="form-control"
                                placeholder="Buscar por nombre o documento..."
                                autocomplete="off"
                            >
                        </div>
                        <div class="col-md-2 d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-search"></i> Buscar
                            </button>
                        </div>
                    </form>
                </div>

                <div class="table-responsive-cards" id="tabla-profesores">
                    {% include 'administrador/gestion_profesor/partials/tabla_profesores.html' %}
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/administrador/gestion_profesor/profesores.js' %}"></script>
</body>
</html>
